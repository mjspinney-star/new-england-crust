<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New England Crust — Goldendoodle Mascot</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #120E08;
    overflow: hidden;
  }

  .badge-wrap {
    width: min(88vw, 88vh);
    height: min(88vw, 88vh);
    max-width: 640px; max-height: 640px;
  }

  /* ---- animations ---------------------------------------- */
  @keyframes tailWag {
    0%, 100% { transform: rotate(-10deg); }
    50% { transform: rotate(14deg); }
  }
  @keyframes earBob {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    35% { transform: rotate(3deg) translateY(3px); }
    70% { transform: rotate(-1.5deg) translateY(1px); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    50% { transform: scale(1.004, 1.012); }
  }
  @keyframes blink {
    0%, 92%, 96%, 100% { transform: scaleY(1); }
    94% { transform: scaleY(0.08); }
  }
  @keyframes tongueWag {
    0%, 65%, 100% { opacity: 0; transform: scaleY(0.3); }
    72%, 92% { opacity: 0.75; transform: scaleY(1); }
  }
  @keyframes badgeGlow {
    0%, 100% { opacity: 0.14; }
    50% { opacity: 0.22; }
  }

  .tail-g   { animation: tailWag 1.1s ease-in-out infinite; transform-origin: 202px 318px; }
  .ear-g    { animation: earBob 2.8s ease-in-out infinite; transform-origin: 272px 232px; }
  .body-g   { animation: breathe 3.2s ease-in-out infinite; transform-origin: 290px 410px; }
  .eye-g    { animation: blink 4.5s ease-in-out infinite; transform-origin: 330px 222px; }
  .tongue-g { animation: tongueWag 5s ease-in-out infinite; transform-origin: 368px 245px; }
  .glow-bg  { animation: badgeGlow 4s ease-in-out infinite; }

  .badge-text {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    letter-spacing: 0.20em;
    fill: #D4832A;
    text-anchor: middle;
    font-variant: small-caps;
  }
  .badge-text-bottom {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-style: italic;
    letter-spacing: 0.14em;
    fill: #D4832A;
    text-anchor: middle;
    opacity: 0.70;
  }
</style>
</head>
<body>
<div class="badge-wrap">
<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ember glow -->
    <radialGradient id="glow" cx="50%" cy="46%" r="32%">
      <stop offset="0%"   stop-color="#D4832A" stop-opacity="0.18"/>
      <stop offset="55%"  stop-color="#C84B2E" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#120E08" stop-opacity="0"/>
    </radialGradient>
    <!-- text arcs -->
    <path id="arcTop"    d="M 78,300 A 222,222 0 0,1 522,300" fill="none"/>
    <path id="arcBottom" d="M 165,520 A 258,258 0 0,0 435,520" fill="none"/>
  </defs>

  <!-- ============ BADGE FRAME ============ -->
  <!-- glow -->
  <circle class="glow-bg" cx="300" cy="280" r="210" fill="url(#glow)"/>

  <!-- outer ring -->
  <circle cx="300" cy="300" r="290" fill="none" stroke="#D4832A" stroke-width="2.5"/>
  <!-- inner ring -->
  <circle cx="300" cy="300" r="277" fill="none" stroke="#D4832A" stroke-width="0.7" opacity="0.45"/>

  <!-- diamond separators at 3 & 9 o'clock -->
  <rect x="17" y="297" width="7" height="7" fill="#D4832A" transform="rotate(45,20.5,300.5)" opacity="0.55"/>
  <rect x="576" y="297" width="7" height="7" fill="#D4832A" transform="rotate(45,579.5,300.5)" opacity="0.55"/>

  <!-- arc text -->
  <text class="badge-text" font-size="21">
    <textPath href="#arcTop" startOffset="50%">NEW ENGLAND CRUST</textPath>
  </text>
  <text class="badge-text-bottom" font-size="13.5">
    <textPath href="#arcBottom" startOffset="50%">Salt Air &amp; Open Flame</textPath>
  </text>

  <!-- small decorative dots along inner ring -->
  <circle cx="300" cy="28"  r="2.2" fill="#D4832A" opacity="0.3"/>
  <circle cx="300" cy="572" r="2.2" fill="#D4832A" opacity="0.3"/>
  <circle cx="180" cy="60"  r="1.5" fill="#D4832A" opacity="0.2"/>
  <circle cx="420" cy="60"  r="1.5" fill="#D4832A" opacity="0.2"/>
  <circle cx="180" cy="540" r="1.5" fill="#D4832A" opacity="0.2"/>
  <circle cx="420" cy="540" r="1.5" fill="#D4832A" opacity="0.2"/>


  <!-- ============ GOLDENDOODLE ============ -->
  <g class="body-g">

    <!-- ---- tail (animated) ---- -->
    <g class="tail-g">
      <path d="M 198,318 C 182,292 168,258 178,230 C 185,212 200,218 196,236"
            fill="none" stroke="#D4A868" stroke-width="18" stroke-linecap="round" opacity="0.92"/>
      <circle cx="180" cy="230" r="15" fill="#D4A868" opacity="0.88"/>
      <circle cx="192" cy="222" r="10" fill="#D8B070" opacity="0.82"/>
      <circle cx="172" cy="242" r="9"  fill="#D4A868" opacity="0.78"/>
    </g>

    <!-- ---- rear body (rump) ---- -->
    <ellipse cx="242" cy="338" rx="70" ry="52" fill="#D4A868"/>
    <!-- rump fluff tufts -->
    <circle cx="190" cy="318" r="16" fill="#D4A868" opacity="0.9"/>
    <circle cx="180" cy="340" r="14" fill="#D8B070" opacity="0.85"/>
    <circle cx="185" cy="360" r="12" fill="#B8904C" opacity="0.8"/>
    <circle cx="200" cy="375" r="11" fill="#D4A868" opacity="0.78"/>

    <!-- ---- body bridge ---- -->
    <rect x="242" y="295" width="62" height="85" rx="22" fill="#D4A868"/>

    <!-- ---- front chest ---- -->
    <ellipse cx="308" cy="325" rx="44" ry="54" fill="#D4A868"/>
    <!-- chest fluff tufts -->
    <circle cx="335" cy="355" r="14" fill="#D4A868" opacity="0.9"/>
    <circle cx="345" cy="338" r="11" fill="#B8904C" opacity="0.8"/>
    <circle cx="340" cy="310" r="10" fill="#D8B070" opacity="0.85"/>
    <circle cx="280" cy="360" r="12" fill="#D4A868" opacity="0.8"/>

    <!-- ---- hind leg ---- -->
    <ellipse cx="212" cy="385" rx="25" ry="32" fill="#B8904C"/>
    <circle cx="198" cy="388" r="10" fill="#B8904C" opacity="0.7"/>
    <ellipse cx="210" cy="414" rx="17" ry="10" fill="#C49858"/>

    <!-- ---- front legs ---- -->
    <rect x="287" y="365" width="21" height="48" rx="10" fill="#D4A868"/>
    <rect x="312" y="368" width="19" height="44" rx="9"  fill="#C49858"/>
    <!-- leg fluff -->
    <circle cx="284" cy="370" r="8" fill="#D8B070" opacity="0.85"/>
    <circle cx="334" cy="372" r="7" fill="#B8904C" opacity="0.75"/>
    <!-- paws -->
    <ellipse cx="297" cy="413" rx="15" ry="8" fill="#C49858"/>
    <ellipse cx="321" cy="412" rx="13" ry="7" fill="#C49858"/>

    <!-- ---- neck ---- -->
    <rect x="278" y="260" width="48" height="50" rx="16" fill="#D4A868"/>

    <!-- ---- bandana ---- -->
    <polygon points="264,276 342,276 312,334 296,336" fill="#D4832A"/>
    <polygon points="264,276 342,276 312,334 296,336" fill="none" stroke="#B86E22" stroke-width="0.8" opacity="0.4"/>
    <!-- knot -->
    <circle cx="342" cy="281" r="8"  fill="#C84B2E"/>
    <circle cx="354" cy="274" r="5.5" fill="#C84B2E"/>
    <!-- bandana fold line -->
    <line x1="280" y1="290" x2="318" y2="320" stroke="#B86E22" stroke-width="0.7" opacity="0.25"/>
    <!-- Ember name on bandana -->
    <text x="304" y="306" text-anchor="middle" font-family="Georgia,serif" font-size="11" font-weight="700" font-style="italic" fill="#120E08" letter-spacing="0.3">Ember</text>

    <!-- ---- head ---- -->
    <circle cx="312" cy="226" r="56" fill="#D4A868"/>
    <!-- fluffy tufts -->
    <circle cx="292" cy="178" r="21" fill="#D4A868"/>
    <circle cx="318" cy="174" r="19" fill="#D8B070"/>
    <circle cx="342" cy="182" r="16" fill="#DCBA78"/>
    <circle cx="270" cy="190" r="18" fill="#D4A868"/>
    <circle cx="354" cy="198" r="14" fill="#D8B070"/>
    <circle cx="258" cy="214" r="15" fill="#D4A868"/>
    <circle cx="360" cy="218" r="12" fill="#DCBA78"/>
    <circle cx="264" cy="242" r="13" fill="#D4A868"/>
    <circle cx="280" cy="170" r="12" fill="#DCBA78"/>
    <circle cx="348" cy="170" r="10" fill="#D8B070"/>

    <!-- ---- snout (longer, retriever-like) ---- -->
    <ellipse cx="365" cy="238" rx="30" ry="18" fill="#C49858"/>
    <circle cx="350" cy="248" r="9" fill="#B8904C" opacity="0.7"/>

    <!-- ---- ear (floppy, animated) ---- -->
    <g class="ear-g">
      <ellipse cx="268" cy="258" rx="20" ry="44" fill="#C49858" transform="rotate(-12,268,258)"/>
      <ellipse cx="270" cy="264" rx="12" ry="30" fill="#A07838" transform="rotate(-12,270,264)" opacity="0.45"/>
    </g>

    <!-- ---- face details ---- -->
    <!-- eye -->
    <g class="eye-g">
      <circle cx="330" cy="222" r="7.5" fill="#120E08"/>
      <circle cx="332" cy="220" r="2.5" fill="#F5E8D0"/>
    </g>
    <!-- brow hint -->
    <path d="M 319,211 Q 330,207 341,211" fill="none" stroke="#A07838" stroke-width="1.5" opacity="0.40"/>

    <!-- nose -->
    <ellipse cx="388" cy="234" rx="8.5" ry="6.5" fill="#120E08"/>
    <ellipse cx="387" cy="232" rx="3" ry="1.8" fill="#2A2018" opacity="0.45"/>

    <!-- mouth line -->
    <path d="M 388,241 C 380,252 370,249 362,245" fill="none" stroke="#3A2A1A" stroke-width="1.5" stroke-linecap="round"/>

    <!-- tongue (animated) -->
    <g class="tongue-g">
      <ellipse cx="375" cy="250" rx="5.5" ry="7" fill="#C84B2E" opacity="0.75"/>
    </g>

    <!-- cheek fluff -->
    <circle cx="365" cy="254" r="9" fill="#C49858" opacity="0.55"/>
    <circle cx="375" cy="250" r="6" fill="#C49858" opacity="0.4"/>

  </g><!-- /body-g -->

</svg>
</div>
</body>
</html>
