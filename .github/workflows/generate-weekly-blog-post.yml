name: Generate Weekly Blog Post

# Writes ONE draft post per week (draft: true). Drafts don't appear on the
# site. To publish: review the file on GitHub, fix anything wrong, change
# `draft: true` to `draft: false`, and commit. Cloudflare builds on the commit.

on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays at 9:00 AM UTC (5:00 AM Eastern)
  workflow_dispatch:      # Manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate draft post via Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/generate-post.cjs

      - name: Commit draft post
        run: |
          if [ -z "${POST_FILENAME:-}" ]; then
            echo "No draft generated (topic queue empty). Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$POST_FILENAME"
          git commit -m "Draft for review: $(basename "$POST_FILENAME")"
          git push
